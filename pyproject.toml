[project]
name = "guildmaster-ai"
version = "0.1.0"
description = "An agentic framework with a fantasy guild metaphor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0",
]
cli = [
    "typer>=0.15.0",
]
# LLM provider extras — install whichever backend(s) you need
openrouter = [
    "langchain-openai>=1.0",
]
anthropic = [
    "langchain-anthropic>=0.3.0",
]
openai = [
    "langchain-openai>=1.0",
]
google = [
    "langchain-google-genai>=2.0.0",
]
azure = [
    # Azure OpenAI uses AzureChatOpenAI from langchain-openai (core dep)
    "langchain-openai>=1.0",
]
bedrock = [
    "langchain-aws>=0.2.0",
]
# Convenience: install all providers at once
all-providers = [
    "langchain-openai>=1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-aws>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["guildmaster_ai"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
