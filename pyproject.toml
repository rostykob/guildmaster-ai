[project]
name = "guildmaster-ai"
version = "0.1.0"
description = "An agentic framework with a fantasy guild metaphor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0",
]
cli = [
    "typer>=0.15.0",
]
# LLM provider extras — install whichever backend(s) you need
openrouter = [
    "langchain-openai>=1.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.0.0",
]
google = [
    "google-genai>=1.0.0",
]
azure = [
    # Azure OpenAI reuses the openai package with AsyncAzureOpenAI
    "openai>=1.0.0",
]
bedrock = [
    "boto3>=1.35.0",
]
# Convenience: install all providers at once
all-providers = [
    "openrouter>=0.1.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["guildmaster_ai"]
